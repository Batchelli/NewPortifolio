<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PortiMax · Portfólio Retrowave</title>
    <meta name="description" content="Portfólio interativo em 3D: explore um mundo retrowave e descubra meus projetos." />
    <meta name="theme-color" content="#0a0014" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffd319'/><stop offset='1' stop-color='%23ff2a9d'/></linearGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23g)'/><rect x='4' y='36' width='56' height='3' fill='%230a0014'/><rect x='4' y='44' width='56' height='4' fill='%230a0014'/><rect x='4' y='53' width='56' height='5' fill='%230a0014'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Share+Tech+Mono&family=Mr+Dafoe&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

    <!-- Efeito CRT sobre a interface -->
    <div class="crt-overlay" aria-hidden="true"></div>

    <!-- ============ LOADING ============ -->
    <section id="loading" class="screen active">
      <div class="loading-box">
        <div class="loading-sun"></div>
        <p class="pixel small">INICIALIZANDO SISTEMA</p>
        <div class="bar"><div class="bar-fill" id="loading-fill"></div></div>
        <p class="mono tiny" id="loading-text">carregando...</p>
      </div>
    </section>

    <!-- ============ MENU PRINCIPAL ============ -->
    <section id="menu" class="screen">
      <div class="menu-inner">
        <header class="logo">
          <h1 class="logo-chrome">PORTIMAX</h1>
          <span class="logo-script">Portfolio</span>
          <p class="logo-sub" id="owner-line"></p>
        </header>

        <p class="press-start pixel blink" id="press-start">PRESSIONE QUALQUER TECLA</p>

        <footer class="menu-footer mono tiny">
          <span>NEON OS · PORTIMAX NX-84</span>
          <span id="footer-year"></span>
        </footer>
      </div>
    </section>

    <!-- ============ HUD ============ -->
    <section id="hud" class="screen">
      <div class="hud-markers" id="hud-markers"></div>
      <div class="crosshair"></div>

      <div class="hud-top-left">
        <div class="hud-counter">
          <span class="pixel tiny">PROJETOS DESCOBERTOS</span>
          <strong class="orbitron" id="hud-count">0/0</strong>
          <div class="hud-progress"><div id="hud-progress-fill"></div></div>
        </div>
      </div>
      <div class="hud-radar mono tiny" id="hud-radar"><kbd>Q</kbd><span>RADAR DE PROJETOS</span></div>

      <div class="hud-route" id="hud-route">
        <span>◎ ROTA</span>
        <strong id="hud-route-name"></strong>
        <span id="hud-route-dist"></span>
      </div>

      <div class="hud-minimap">
        <canvas id="minimap" width="200" height="200"></canvas>
        <span class="pixel tiny minimap-n">N</span>
      </div>
      <div class="hud-coords mono tiny" id="hud-coords"></div>
      <div class="hud-location pixel" id="hud-location"></div>

      <div class="district-banner" id="district-banner" aria-live="polite">
        <span class="pixel">BAIRRO</span>
        <strong class="orbitron"></strong>
        <small class="mono"></small>
      </div>

      <div class="hud-hints mono tiny" id="hud-hints">
        <span><kbd>W A S D</kbd> mover</span>
        <span><kbd>SHIFT</kbd> correr</span>
        <span><kbd>ESPAÇO</kbd> pular</span>
        <span><kbd>Q</kbd> radar</span>
        <span><kbd>TAB</kbd> tablet</span>
        <span><kbd>ESC</kbd> menu</span>
      </div>

      <div class="interact-prompt" id="interact-prompt">
        <kbd class="key-e">E</kbd>
        <span class="pixel small" id="interact-text">ABRIR PROJETO</span>
      </div>

      <div class="toasts" id="toasts"></div>

      <!-- Controles touch (mobile) -->
      <div class="touch-ui" id="touch-ui">
        <div class="joystick" id="joystick"><div class="joystick-knob" id="joystick-knob"></div></div>
        <button class="touch-btn touch-jump" id="touch-jump">▲</button>
        <button class="touch-btn touch-e" id="touch-e">E</button>
        <button class="touch-btn touch-pause" id="touch-pause">II</button>
        <button class="touch-btn touch-scan" id="touch-scan" aria-label="Radar de projetos">◎</button>
      </div>
    </section>

    <!-- Aviso quando o pointer lock falha -->
    <div id="click-to-play" class="click-to-play pixel small">CLIQUE PARA CONTINUAR</div>

    <noscript>Este portfólio precisa de JavaScript e WebGL para funcionar.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
